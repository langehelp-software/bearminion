version: 2
updates:
  # GitHub Actions used by ci.yml and release.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The pnpm workspace: packages/editor, templates/default and tests share the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Linked from packages/editor inside the workspace; its range moves with releases (changesets), not Dependabot.
      - dependency-name: bearminion
    groups:
      minor-and-patch:
        update-types: [minor, patch]
