version: 2
updates:
  # GitHub Actions used by ci.yml and release.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The pnpm workspace: packages/editor, templates/default and tests share the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Linked from packages/editor inside the workspace; its range moves with releases (changesets), not Dependabot.
      - dependency-name: bearminion
      # Tracks the oldest supported Node (engines: >=22.12), not the newest.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # A TypeScript major needs tsdown, astro check and the d.ts build to support it first: upgrade by hand.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
