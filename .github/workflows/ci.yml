name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the published package
        working-directory: packages/editor
        run: |
          pnpm dlx publint@0.3.25
          pnpm dlx @arethetypeswrong/cli@0.18.5 --pack . --profile esm-only
      # publint packs without running prepack, so build the CLI (and copy its template) first.
      - name: Check the published CLI
        working-directory: packages/create-bearminion
        run: |
          pnpm build
          pnpm dlx publint@0.3.25

  e2e:
    name: Editor end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bearminion/tests exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  create:
    name: npm create bearminion (${{ matrix.storybook && 'with Storybook' || 'default' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        storybook: [false, true]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack bearminion and create-bearminion
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          pnpm --filter bearminion pack --pack-destination "$RUNNER_TEMP/packs"
          pnpm --filter create-bearminion pack --pack-destination "$RUNNER_TEMP/packs"
      # The packed CLI, run the way npm create runs it. Installing is left to the next step, so the site uses the
      # packed library instead of the version on npm.
      - name: Create a site with the packed CLI
        working-directory: ${{ runner.temp }}
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          # An absolute path: npm reads `packs/x.tgz` as a GitHub `user/repo` and fetches nothing.
          npm exec --yes --package="$(ls "$RUNNER_TEMP"/packs/create-bearminion-*.tgz)" -- create-bearminion site \
            --yes --no-install --name "CI Site" --url ci.example.com ${{ matrix.storybook && '--storybook' || '' }}
      - name: Install the packed library, check and build the site
        working-directory: ${{ runner.temp }}/site
        run: |
          npm pkg set "dependencies.bearminion=file:$(ls "$RUNNER_TEMP"/packs/bearminion-*.tgz)"
          npm install --no-audit --no-fund
          npx astro check
          npx astro build
          git log --oneline -1
          grep -q '"url": "https://ci.example.com"' content/site.json
          test ! -e dist/style-guide && test ! -e dist/variants
      - name: Build Storybook
        if: matrix.storybook
        working-directory: ${{ runner.temp }}/site
        run: npx storybook build --quiet
