name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A pull request that only changes bearminion.com's content (pages, images, the demo video) skips the editor's
  # checks and tests: the `sites` job still builds the site, which validates the content. Skipped jobs count as
  # passed for required checks, so content pull requests are not left waiting.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          code=$(printf '%s\n' "$changed" | grep -vE '^apps/web/(content|src/assets/uploads|public)/' | grep -v '^$' || true)
          if [ -n "$code" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
          printf 'Changed outside the site content:\n%s\n' "${code:-(nothing)}"

  check:
    name: Lint, types, unit tests, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the published package
        working-directory: packages/editor
        run: |
          pnpm dlx publint@0.3.25
          pnpm dlx @arethetypeswrong/cli@0.18.5 --pack . --profile esm-only
      # publint packs without running prepack, so build the CLI (and copy its template) first.
      - name: Check the published CLI
        working-directory: packages/create-bearminion
        run: |
          pnpm build
          pnpm dlx publint@0.3.25

  sites:
    name: bearminion.com and docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The template's own build is the reference for the style check below.
      - run: pnpm build
      # Syncs the template's code into apps/web, then builds it: the content is validated against the template's schemas.
      - run: pnpm web:build
      # Fails on a broken link or #anchor between pages, or to a file in the repository.
      - run: pnpm docs:build
      - name: bearminion.com has the template's styles
        run: pnpm --filter @bearminion/web check-styles
      - name: The builds change no tracked files
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            echo "The builds left changes (a file that should be gitignored, or a stale synced copy):"
            echo "$status"
            exit 1
          fi

  e2e:
    name: Editor end-to-end
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bearminion/tests exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  create:
    name: npm create bearminion (${{ matrix.storybook && 'with Storybook' || 'default' }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        storybook: [false, true]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack bearminion and create-bearminion
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          pnpm --filter bearminion pack --pack-destination "$RUNNER_TEMP/packs"
          pnpm --filter create-bearminion pack --pack-destination "$RUNNER_TEMP/packs"
      # The packed CLI, run the way npm create runs it. Installing is left to the next step, so the site uses the
      # packed library instead of the version on npm.
      - name: Create a site with the packed CLI
        working-directory: ${{ runner.temp }}
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          # An absolute path: npm reads `packs/x.tgz` as a GitHub `user/repo` and fetches nothing.
          npm exec --yes --package="$(ls "$RUNNER_TEMP"/packs/create-bearminion-*.tgz)" -- create-bearminion site \
            --yes --no-install --name "CI Site" --url ci.example.com ${{ matrix.storybook && '--storybook' || '' }}
      - name: Install the packed library, check and build the site
        working-directory: ${{ runner.temp }}/site
        run: |
          npm pkg set "dependencies.bearminion=file:$(ls "$RUNNER_TEMP"/packs/bearminion-*.tgz)"
          npm install --no-audit --no-fund
          npx astro check
          npx astro build
          git log --oneline -1
          grep -q '"url": "https://ci.example.com"' content/site.json
          test ! -e dist/style-guide && test ! -e dist/variants
      # `bearminion add` from the packed library: take two sections out of the fresh site and add them back. The site
      # was committed when it was created, so a correct `add` leaves nothing to commit.
      - name: Add sections back with the packed CLI
        working-directory: ${{ runner.temp }}/site
        run: |
          # Stories are not part of what `add` copies, so they stay.
          find src/components/sections/gallery src/components/sections/text -type f ! -name '*.stories.ts' -delete
          npx bearminion add gallery text --dry-run
          npx bearminion add gallery text --yes
          npx bearminion sync --check
          npx astro check
          npx astro build
          # Only the site's own files: the install above changed package.json and the lock file on purpose.
          status=$(git status --porcelain -- src bearminion.lock.json)
          if [ -n "$status" ]; then
            echo "add did not restore the site as it was created:"
            echo "$status"
            exit 1
          fi
      - name: Build Storybook
        if: matrix.storybook
        working-directory: ${{ runner.temp }}/site
        run: npx storybook build --quiet
