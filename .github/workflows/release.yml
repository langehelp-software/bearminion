name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # With pending changesets: opens the "Version packages" pull request. Without: publishes what is not on npm yet.
      # Publishing uses npm trusted publishing (OIDC from `id-token: write`), so there is no npm token in this repository.
      - uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
        env:
          # pnpm reads PNPM_CONFIG_PROVENANCE, not NPM_CONFIG_PROVENANCE or publishConfig.provenance.
          PNPM_CONFIG_PROVENANCE: true
